name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The share images are photographs of the built site, taken by
      # scripts/screenshot-og.ts, so the build needs a browser. It is the only
      # one in the repo — the test suite renders in happy-dom — and it is only
      # needed here, which is why CI does not install it.
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install --with-deps chromium

      - run: bun run build

      # GitHub Pages serves 404.html for any unknown path. React Router emits a
      # __spa-fallback.html that hydrates any route — use it so non-prerendered
      # paths still resolve client-side.
      - run: cp build/client/__spa-fallback.html build/client/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
