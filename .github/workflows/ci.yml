name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Runs the rule selectors through ESLint with the generated config —
      # the same file consumers download from /api/rules/eslint.config.js.
      - run: bun run test

      - run: bun run typecheck
