name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Runs every rule through the real Biome CLI with the generated config and
      # GritQL plugins — the same artifacts consumers download from /api/rules/.
      - run: bun run test

      - run: bun run typecheck
