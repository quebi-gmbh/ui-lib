      <stop offset="0" stop-color="#0b2b2b"/>
      <stop offset="1" stop-color="#2dd4a8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g1)"/>
  <circle cx="300" cy="90" r="46" fill="#ffffff" fill-opacity="0.18"/>
